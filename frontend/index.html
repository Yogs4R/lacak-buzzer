      <div style="max-width: 800px; margin: 40px auto; padding: 24px; font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; color: #f4f4f5; background: #18181b; border-radius: 8px;">
        <h1 style="font-size: 24px; margin-bottom: 12px; color: #f97316;">Lacak Buzzer | Analisis Akun X/Twitter</h1>
        <p>Lacak Buzzer adalah alat analisis independen untuk menghasilkan <strong>Indikator Risiko Amplifikasi Terkoordinasi (skor 0–100)</strong> berbasis pola perilaku akun X/Twitter.</p>
        <p style="background: #27272a; padding: 12px; border-left: 4px solid #f97316; font-size: 14px;">
          <em>Catatan Penting: Skor ini adalah indikator risiko berbasis pola perilaku, bukan bukti bahwa akun tersebut terkoordinasi, palsu, dibayar, atau memiliki niat tertentu.</em>
        </p>
        <h2 style="font-size: 18px; margin-top: 20px;">Fitur &amp; Metodologi Utama:</h2>
        <ul>
          <li>Analisis kemiripan semantik tweet menggunakan model lokal <code>sentence-transformers/all-MiniLM-L6-v2</code>.</li>
          <li>Evaluasi 7 metrik perilaku berbobot tetap (kemiripan, tagar, intensitas posting, rasio media/URL, interaksi, risiko profil, entropi interval).</li>
          <li>Arsitektur 100% Stateless — privasi terlindungi tanpa menyimpan tweet mentah atau riwayat pencarian.</li>
        </ul>
