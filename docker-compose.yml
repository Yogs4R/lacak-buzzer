services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lacak-buzzer-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:7860"
    environment:
      - PORT=7860
      - TWS_DATA_DIR=/home/user/app/data
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      - TWITTER_ACCOUNTS_JSON=${TWITTER_ACCOUNTS_JSON:-}
      - X_BOT_USERNAME=${X_BOT_USERNAME:-}
      - X_BOT_POLL_INTERVAL=${X_BOT_POLL_INTERVAL:-60}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173,http://localhost}
    volumes:
      - backend-data:/home/user/app/data
      - ./backend/secrets:/home/user/app/secrets:ro
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: lacak-buzzer-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
