# Dependabot configuration untuk auto-update GitHub Actions versions.
# Setiap ada versi baru dari action yang digunakan, Dependabot akan
# otomatis membuka Pull Request. Tidak perlu manual tracking.
version: 2
updates:
  # Update GitHub Actions secara otomatis setiap minggu
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    labels:
      - "dependencies"
      - "github-actions"
    # Batas maksimum PR terbuka sekaligus agar tidak membanjiri inbox
    open-pull-requests-limit: 5

  # Update Python dependencies (pip) secara otomatis setiap minggu
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
