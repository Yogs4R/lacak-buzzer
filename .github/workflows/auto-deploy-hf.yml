name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  # Mengizinkan penjalanan manual dari tab Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions-bot@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"
          
          # Buat folder terpisah untuk inisialisasi git bersih
          mkdir -p ../temp_deploy
          cp -r backend/* ../temp_deploy/
          cd ../temp_deploy
          
          git init
          git checkout -b main
          git add .
          git commit -m "Deploy backend to Hugging Face Spaces"
          
          # Lakukan force push langsung ke main branch di Hugging Face Space
          git push -f https://Yogs4R:$HF_TOKEN@huggingface.co/spaces/Yogs4R/lacak-buzzer-backend main:main
